<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            box-sizing: border-box;
            background-color: rgb(144, 201, 208);
            width: 210px;
            height: 320px;
            margin: auto;
            padding-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            border-radius: 10px;
            border-color: rgb(21, 20, 20);
            font-style: normal;
            font-display: auto;
        }
        .card-body{
            padding: 16px 8px 8px;
        }
        .card-title{
            font-size: 18px;
            color: rgb(65, 31, 31);
            padding-bottom: 10px;
        }
        .tag{
            background-color: rgb(173, 211, 212);
            color: rgba(21, 16, 16, 0.937);
            font-size: 12px;
            border-radius: 4px;
            padding: 2px;
            border: 2px solid rgb(92, 165, 194);

        }

        .tag-body{
            padding-top: 5px;
        }

        .card-title-box{
            padding: 0px;
            /* box-shadow:; */
        }
        .text{
            color: aliceblue;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 8px;
            margin-top: -12px;
        }
        .button-text{
            font-size: 10px;
            
        color: black;
            background-color: rgb(198, 216, 221);
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: 900;
            margin-top: 5px;
            margin-left: 15px;
            border: none;
        }
       .iborder{
        border: 2px solid rgb(28, 126, 172); 
        border-radius: 20px;
        border-image-outset: 20px;
       }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://thumbs.dreamstime.com/b/back-view-man-boat-spreading-hands-arriving-to-exotic-tropical-island-lit-sun-light-travelling-tour-back-view-236918698.jpg" width="190" height="150" class="iborder">
      

        <div class="tag-body">
            <span class="tag">Wonder</span>
            <span class="tag">FlyHigh</span>
        </div>


        <div class="card-title-box">
            <h2 class="card-title">Solo Travelling</h2>
        </div>


        <div>
            <p class="text"><b>Follow the adventures program and learn new things with lot of experience of day to day life at a minimal costs.</b></p>
        </div>
        <div>
            <button class="button-text">Book now</button>
            <button class="button-text">Add to list</button>

        </div>
      </div>
</body>
</html>
